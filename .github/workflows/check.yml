name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check published profiles
        run: python scripts/manage_profile.py check --all
      - name: Python checks (local fake providers only)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Browser logic checks
        run: node --experimental-vm-modules --test tests/*.test.mjs
      - name: Build demo download
        run: python scripts/package_demo.py --out out/digital-memorial-demo.zip
      - name: Upload demo download
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digital-memorial-demo
          path: out/digital-memorial-demo.zip
          if-no-files-found: error
          retention-days: 30
